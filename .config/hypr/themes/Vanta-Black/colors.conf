# Vanta-Black Theme Configuration
$color0  = rgba(090f15ff)   # Midnight (base background)
$color1  = rgba(d3d1ceff)   # Arctic (active border 1)
$color2  = rgba(262e36ff)   # Mountainside
$color3  = rgba(262e36ff)
$color4  = rgba(6c6d74ff)   # Apres Ski
$color5  = rgba(6c6d74ff)
$color6  = rgba(b3b7baff)   # Slopes
$color7  = rgba(d3d1ceff)   # Arctic
$color8  = rgba(090f15ff)   # Midnight
$color9  = rgba(262e36ff)   # Mountainside
$color10 = rgba(6c6d74ff)   # Apres Ski
$color11 = rgba(6c6d74ff)
$color12 = rgba(b3b7baff)   # Slopes
$color13 = rgba(b3b7baff)
$color14 = rgba(d3d1ceff)   # Arctic
$color15 = rgba(d3d1ceff)   # Arctic

$font    = "JetBrains Mono Nerd Font"
$rounding = 0
$shadow_color = rgba(000000ee)
$wallpaper = ~/.config/hypr/themes/Vanta-Black/wallpapers/makima_is_listening.jpg

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = rgba(ffffffee) rgba(bfbfbfb0) rgba(bfbfbfb0) rgba(ffffffee) 45deg
    col.inactive_border = rgba(2a2a2ab0) rgba(3c3c3cb0) rgba(3c3c3cb0) rgba(2a2a2ab0) 45deg
    resize_on_border = yes
}

decoration {
    rounding = $rounding

    active_opacity = 0.95
    inactive_opacity = 0.95

    blur {
        enabled = yes
        size = 5
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0
        popups = true
    }

    dim_inactive = false
    dim_strength = 0.05

    shadow {
        enabled = true
        range = 30
        scale = 2
        render_power = 5
        color = $shadow_color
        color_inactive = rgba(050505ff)
    }
}

group {
    col.border_inactive = rgba(1a1a1ab0)
    col.border_active = rgba(ffffffee) rgba(bfbfbfb0) rgba(bfbfbfb0) rgba(ffffffee) 45deg

    groupbar {
        col.active = rgba(bfbfbfcc)
        col.inactive = rgba(82828299)
        font_family = JetBrainsMono NFM
        font_size = 10
        text_color = rgba(ffffffff)
    }
}

layerrule = unset,waybar
