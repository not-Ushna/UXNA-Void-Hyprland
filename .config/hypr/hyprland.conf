# ╠══════════════════════════════════════════════════════════════════╣
# ║  Hyprland Config  ·  by uxna  ·  void-hyprland-themes            ║
# ╚══════════════════════════════════════════════════════════════════╝

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Theme                                                               ║
# ╚══════════════════════════════════════════════════════════════════════╝
# Injects $color0–$color15, $background, $foreground, $rounding etc.
source = ~/.config/hypr/themes/current/colors.conf

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Monitor                                                             ║
# ╚══════════════════════════════════════════════════════════════════════╝
monitor = eDP-1, 1920x1080@144, auto, 1.25          # Internal 1080p @ 144Hz

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Default Applications                                                ║
# ╚══════════════════════════════════════════════════════════════════════╝
$terminal    = kitty
$fileManager = nautilus
$menu        = rofi -show drun -theme /home/uxna/.config/hypr/themes/current/rofi/launcher.rasi

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Autostart                                                           ║
# ╚══════════════════════════════════════════════════════════════════════╝
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 &   # Polkit (flatpak auth)
exec-once = swww-daemon                                           # Wallpaper daemon
exec-once = sleep 0.5 && swww img $wallpaper --transition-fps 60 --transition-type any
exec-once = sleep 1 && waybar -c ~/.config/hypr/waybar/current-layout -s ~/.config/hypr/themes/current/waybar/style.css
exec-once = dunst -conf ~/.config/hypr/themes/current/dunst/dunstrc
exec-once = nm-applet --indicator                                 # Network manager tray
exec-once = ln -sf $XDG_RUNTIME_DIR/app/com.discordapp.Discord/discord-ipc-0 $XDG_RUNTIME_DIR/discord-ipc-0 # Discord RPC Fix
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store          # Clipboard history (text)
exec-once = wl-paste --type image --watch cliphist store          # Clipboard history (images)
# exec-once = blueman-applet                                        # Bluetooth tray
exec-once = swayidle -w \
    timeout 240 '~/.config/hypr/scripts/launch-screensaver.sh' \
    timeout 300 '~/.config/hypr/scripts/lock.sh' \
    timeout 600 'hyprctl dispatch dpms off' \
    resume  'hyprctl dispatch dpms on'                            # Idle → screensaver → lock → display off
exec-once = ~/.config/hypr/scripts/smart-battery.sh              # Low-battery notifications

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Environment Variables                                               ║
# ╚══════════════════════════════════════════════════════════════════════╝
env = XCURSOR_SIZE,        24
env = HYPRCURSOR_SIZE,     24
env = PATH,                $HOME/.local/bin:$PATH
env = QT_QPA_PLATFORMTHEME, qt5ct                                 # Qt theming via qt5ct
env = MOZ_ENABLE_WAYLAND,  1                                      # Firefox native Wayland

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  General                                                             ║
# ╚══════════════════════════════════════════════════════════════════════╝
general {
    gaps_in             = 4                # Gap between windows — more breathing room
    gaps_out            = 10              # Gap between windows and screen edge
    border_size         = 2
    col.active_border   = $color1 $color6 45deg
    col.inactive_border = $color8
    resize_on_border    = true             # Drag border edges to resize
    allow_tearing       = false
    layout              = dwindle
}

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Decoration                                                          ║
# ╚══════════════════════════════════════════════════════════════════════╝
decoration {
    rounding         = $rounding           # Corner radius (set per-theme in colors.conf)
    active_opacity   = 0.94               # Focused window — glassy
    inactive_opacity = 0.85               # Unfocused — noticeably dimmer, deep glass

    shadow {
        enabled      = true
        range        = 20                 # Larger shadow spread = more depth
        render_power = 3
        color        = $shadow_color
        offset       = 0, 4              # Subtle downward offset for realism
    }

    blur {
        enabled          = true
        size             = 6             # Larger blur radius = softer background
        passes           = 4             # More passes = smoother, less banding
        vibrancy         = 0.20          # Let wallpaper colors subtly tint blur
        vibrancy_darkness = 0.10
        noise            = 0.008         # Tiny film-grain for organic feel
        contrast         = 0.95          # Slightly softer contrast in blurred areas
        brightness       = 0.90
        new_optimizations = true
    }
}

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Animations                                                          ║
# ╚══════════════════════════════════════════════════════════════════════╝
# Loaded from the active theme — each theme can have its own feel
source = ~/.config/hypr/themes/current/animations.conf

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Input                                                               ║
# ╚══════════════════════════════════════════════════════════════════════╝
input {
    kb_layout   = us
    follow_mouse = 1
    sensitivity  = 0                       # -1.0 to 1.0, 0 = no acceleration

    touchpad {
        natural_scroll      = false
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe         = true
    workspace_swipe_fingers = 3            # 3-finger swipe to change workspaces
}

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Misc                                                                ║
# ╚══════════════════════════════════════════════════════════════════════╝
misc {
    force_default_wallpaper  = 0           # Don't force Hyprland's default wallpaper
    disable_hyprland_logo    = true
    disable_splash_rendering = true
}

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Layout Engines                                                      ║
# ╚══════════════════════════════════════════════════════════════════════╝
dwindle {
    preserve_split = true                  # Keep split direction when closing windows
}

master {
    new_status = master                    # New windows become master
}

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Window Rules                                                        ║
# ╚══════════════════════════════════════════════════════════════════════╝
# Float utility windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = float, class:^(qt5ct)$
windowrulev2 = float, class:^(qt6ct)$
windowrulev2 = float, title:^(Picture-in-Picture)$

# Screensaver — fullscreen + float (no titlebar, no gaps)
windowrulev2 = fullscreen, class:^(org.uxna.screensaver)$
windowrulev2 = float,      class:^(org.uxna.screensaver)$

# Scratchpad dropdown terminal
windowrulev2 = float,                    class:^(scratchpad)$
windowrulev2 = size 80% 80%,             class:^(scratchpad)$
windowrulev2 = center,                   class:^(scratchpad)$
windowrulev2 = workspace special:scratchpad, class:^(scratchpad)$

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Keybindings                                                         ║
# ╚══════════════════════════════════════════════════════════════════════╝
$mainMod = SUPER

# ·· Window Management ··
bind = $mainMod,       Q,      killactive
bind = ALT,            F4,     killactive
bind = $mainMod,       Delete, exec, hyprctl dispatch exit   # Exit Hyprland
bind = $mainMod,       W,      togglefloating
bind = $mainMod,       G,      togglegroup
bind = SHIFT,          F11,    fullscreen
bind = $mainMod,       J,      togglesplit                   # Toggle dwindle split

# ·· Focus ··
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = ALT, Tab, exec, hyprctl --batch "dispatch cyclenext ; dispatch alterzorder top"

# ·· Move Windows ··
bind = $mainMod CTRL SHIFT, left,  movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up,    movewindow, u
bind = $mainMod CTRL SHIFT, down,  movewindow, d

# ·· Resize ··
bind  = $mainMod SHIFT, right, resizeactive,  30  0
bind  = $mainMod SHIFT, left,  resizeactive, -30  0
bind  = $mainMod SHIFT, up,    resizeactive,   0 -30
bind  = $mainMod SHIFT, down,  resizeactive,   0  30
bindm = $mainMod, mouse:272,   movewindow
bindm = $mainMod, mouse:273,   resizewindow



# ·· Application Launchers ··
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, flatpak run com.visualstudio.code
bind = $mainMod, B, exec, flatpak run app.zen_browser.zen
bind = $mainMod, K, exec, flatpak run org.kde.kate
bind = $mainMod, S, exec, flatpak run com.spotify.Client
bind = CTRL SHIFT, Escape, exec, btop

# ·· Menus & Search ··
bind = $mainMod,       A,   exec, pkill -x rofi || $menu
bind = $mainMod,       TAB, exec, pkill -x rofi || rofi -show window      -theme /home/uxna/.config/hypr/themes/current/rofi/launcher.rasi
bind = $mainMod SHIFT, E,   exec, pkill -x rofi || rofi -show filebrowser -theme /home/uxna/.config/hypr/themes/current/rofi/launcher.rasi
bind = $mainMod,       N,   exec, ~/.config/hypr/scripts/network-menu.sh
bind = $mainMod,       V,   exec, cliphist list | rofi -dmenu -theme /home/uxna/.config/hypr/themes/current/rofi/launcher.rasi | cliphist decode | wl-copy

# ·· System ··
bind = $mainMod,       L,    exec, ~/.config/hypr/scripts/lock.sh
bind = $mainMod CTRL,  L,    exec, ~/.config/hypr/scripts/launch-screensaver.sh
bind = $mainMod,       X,    exec, ~/.config/hypr/scripts/launch-wlogout.sh
bind = $mainMod SHIFT, D,    exec, ~/.config/hypr/scripts/focus-mode.sh
bind = $mainMod ALT,   T,    exec, ~/.config/hypr/scripts/toggle-dropdown.sh
bind = $mainMod,       slash,exec, ~/.config/hypr/scripts/keybinds-hint.sh

# ·· Theme & Wallpaper ··
bind = $mainMod SHIFT, T,    exec, ~/.config/hypr/scripts/switch-theme.sh
bind = $mainMod ALT,   up,   exec, ~/.config/hypr/scripts/switch-theme.sh prev
bind = $mainMod ALT,   down, exec, ~/.config/hypr/scripts/switch-theme.sh next
bind = $mainMod ALT,   left, exec, ~/.config/hypr/scripts/switch-wallpaper.sh prev
bind = $mainMod ALT,   right,exec, ~/.config/hypr/scripts/switch-wallpaper.sh next
bind = $mainMod SHIFT, W,    exec, ~/.config/hypr/scripts/switch-wallpaper.sh

# ·· Screenshots ··
bind = $mainMod,       P,     exec, ~/.config/hypr/scripts/screenshot.sh
bind = ,               Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod,       Print, exec, ~/.config/hypr/scripts/screenshot.sh full


# ·· Multimedia ··
bindl = , XF86AudioMute,        exec, pactl set-sink-mute   @DEFAULT_SINK@ toggle
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioPlay,        exec, playerctl play-pause
bindl = , XF86AudioNext,        exec, playerctl next
bindl = , XF86AudioPrev,        exec, playerctl previous
bindl = , XF86MonBrightnessUp,  exec, brightnessctl set +10%
bindl = , XF86MonBrightnessDown,exec, brightnessctl set 10%-

# ·· Power Profiles (F1/F2/F3) ··
bind = $mainMod, F1, exec, powerprofilesctl set power-saver
bind = $mainMod, F2, exec, powerprofilesctl set balanced
bind = $mainMod, F3, exec, powerprofilesctl set performance

# ·· Workspaces — Switch ··
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ·· Workspaces — Move Window ··
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ·· Workspaces — Navigate ··
bind = $mainMod CTRL,  right, workspace, r+1    # Next workspace
bind = $mainMod CTRL,  left,  workspace, r-1    # Prev workspace
bind = $mainMod CTRL,  down,  workspace, empty  # Jump to empty workspace
bind = $mainMod SHIFT, S,     movetoworkspace, special
bind = $mainMod, mouse_down,  workspace, e+1
bind = $mainMod, mouse_up,    workspace, e-1

# ·· Workspace — Move to adjacent (with window) ··
bind = $mainMod ALT CTRL, right, movetoworkspace, r+1
bind = $mainMod ALT CTRL, left,  movetoworkspace, r-1
