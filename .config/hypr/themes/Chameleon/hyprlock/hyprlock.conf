# ╔══════════════════════════════════════════════════════════════════╗
# ║  Hyprlock  ·  Chameleon Theme                                  ║
# ║  Auto-regenerated by chameleon-chwall.sh on wallpaper change   ║
# ╚══════════════════════════════════════════════════════════════════╝

# --- General ---------------------------------------------------
general {
    no_fade_in         = false
    no_fade_out        = false
    grace              = 0
    ignore_empty_input = true
    hide_cursor        = true
}

# --- Background ------------------------------------------------
# Wallpaper with blur + slight dim for readability
background {
    monitor           =
    path              = ~/.cache/current_wallpaper
    blur_passes       = 4
    blur_size         = 7
    contrast          = 0.95
    brightness        = 0.45
    vibrancy          = 0.15
    vibrancy_darkness = 0.35
}

# --- Clock (large, centered) -----------------------------------
label {
    monitor       =
    text          = $TIME
    color         = rgba(4e4ab2ff)
    font_size     = 96
    font_family   = JetBrainsMono Nerd Font Bold
    position      = 0, 120
    halign        = center
    valign        = center
    shadow_passes = 3
    shadow_size   = 12
    shadow_color  = rgba(0,0,0,0.8)
    shadow_boost  = 1.2
}

# --- Date (below clock) ----------------------------------------
label {
    monitor       =
    text          = cmd[update:60000] date +"%A, %B %d"
    color         = rgba(4e4ab2cc)
    font_size     = 16
    font_family   = JetBrainsMono Nerd Font
    position      = 0, 42
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0,0,0,0.7)
}

# --- Password input field (glassmorphic card) -------------------
input-field {
    monitor           =
    size              = 320, 55
    outline_thickness = 2
    dots_size         = 0.28
    dots_spacing      = 0.55
    dots_center       = true
    dots_rounding     = -1

    outer_color       = rgba(4e4ab266)
    inner_color       = rgba(0c070899)
    font_color        = rgba(4e4ab2ff)
    font_family       = JetBrainsMono Nerd Font

    fade_on_empty     = true
    placeholder_text  = <span foreground="#4e4ab299"> Enter Password</span>
    hide_input        = false

    check_color       = rgba(2b47bdff)
    fail_color        = rgba(adb460ff)
    fail_text         = <span foreground="#adb460"><i> $FAIL ($ATTEMPTS)</i></span>
    capslock_color    = rgba(754950ff)

    position          = 0, -80
    halign            = center
    valign            = center
    rounding          = 14

    shadow_passes     = 3
    shadow_size       = 10
    shadow_color      = rgba(0,0,0,0.6)
}

# --- Username label (above input field) ------------------------
label {
    monitor       =
    text          =  uxna
    color         = rgba(b1a8abcc)
    font_size     = 13
    font_family   = JetBrainsMono Nerd Font
    position      = 0, -28
    halign        = center
    valign        = center
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0,0,0,0.5)
}

# --- Bottom: uptime (left) -------------------------------------
label {
    monitor     =
    text        = cmd[update:60000] echo " $(uptime -p | sed 's/up //')"
    color       = rgba(b1a8ab66)
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    position    = -40, 28
    halign      = left
    valign      = bottom
}

# --- Bottom: battery (right) -----------------------------------
label {
    monitor     =
    text        = cmd[update:30000] bash -c 'b=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo "?"); s=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null || echo ""); [ "$s" = "Charging" ] && echo "󰂄 $b%" || echo "󰁹 $b%"'
    color       = rgba(b1a8ab66)
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    position    = -40, 28
    halign      = right
    valign      = bottom
}

# --- Bottom: theme branding (center) ---------------------------
label {
    monitor     =
    text        = 🦎 CHAMELEON
    color       = rgba(4e4ab233)
    font_size   = 10
    font_family = JetBrainsMono Nerd Font
    position    = 0, 14
    halign      = center
    valign      = bottom
}
