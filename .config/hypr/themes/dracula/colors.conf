# Hyprland Colors - Dracula
# Generated by theme-switcher
# Source this file in your appearance.conf

$active_border = rgb(bd93f9)
$inactive_border = rgb(44475a)
$shadow_active = rgba(bd93f944)
$shadow_inactive = rgba(282a3644)

general {
    col.active_border = $active_border
    col.inactive_border = $inactive_border
}

decoration {
    shadow {
        color = $shadow_active
        color_inactive = $shadow_inactive
    }
}

# Variables required by hyprland.conf
$font      = "JetBrains Mono Nerd Font"
$rounding  = 14
$shadow_color = $shadow_active
$wallpaper = ~/.config/hypr/themes/current/wallpapers/main.png
