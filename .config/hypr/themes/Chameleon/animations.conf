# ╔══════════════════════════════════════════════════════════════╗
# ║  Chameleon Theme — animations.conf                         ║
# ║  Butter-smooth motion — maximum silkiness                  ║
# ╚══════════════════════════════════════════════════════════════╝

animations {
    enabled = yes

    # --- Bezier Curves ---------------------------------------------
    # Butter: near-zero start, glides into rest — the smoothest possible
    bezier = butter,    0.0,  0.8,  0.2,  1.0

    # Expo: exponential deceleration — snappy start, dreamy coast to stop
    bezier = expo,      0.16, 1.0,  0.3,  1.0

    # Overture: gentle overshoot so windows feel alive, not stiff
    bezier = overture,  0.34, 1.2,  0.64, 1.0

    # Melt: window melts away cleanly — smooth close, no hard stop
    bezier = melt,      0.7,  0.0,  0.84, 0.0

    # Drift: very long, slow ease-out for ambient transitions
    bezier = drift,     0.0,  0.0,  0.1,  1.0

    # --- Windows ---------------------------------------------------
    # Opening: longer duration + expo curve = elegant entry every time
    animation = windowsIn,   1, 8,  expo,    popin 75%

    # Closing: clean melt-away, not too slow so it never feels sluggish
    animation = windowsOut,  1, 6,  melt,    popin 90%

    # Moving/resizing: butter-smooth repositioning, no wobble
    animation = windowsMove, 1, 6,  butter

    # --- Border ----------------------------------------------------
    # Languid color fade when focus changes — barely noticeable shift
    animation = border,      1, 12, drift

    # Slow animated border hue loop for a subtle ambient glow
    animation = borderangle, 1, 180, drift, loop

    # --- Fades -----------------------------------------------------
    # Base fade — everything inherits this unless overridden
    animation = fade,        1, 8,  drift

    # Fade IN: slightly longer so elements appear to materialise
    animation = fadeIn,      1, 9,  expo

    # Fade OUT: a bit faster so things don't linger
    animation = fadeOut,     1, 6,  melt

    # Focus switch: a barely-there crossfade, very calm
    animation = fadeSwitch,  1, 10, drift

    # Shadow: shadows appear and vanish slowly — no pop
    animation = fadeShadow,  1, 10, drift

    # Dim: unfocused windows dim and undim very gradually
    animation = fadeDim,     1, 14, drift

    # --- Workspaces ------------------------------------------------
    # Slide: expo curve gives an iOS-like swipe that coasts to a stop
    animation = workspaces,        1, 8,  expo,   slide

    # Scratchpad/special: glides up from below, no bounce
    animation = specialWorkspace,  1, 8,  butter, slidevert
}
