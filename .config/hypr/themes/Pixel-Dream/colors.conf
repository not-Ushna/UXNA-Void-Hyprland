# ============================================================
# Pixel-Dream Theme — Color Palette
# ============================================================
# Ported from the HyDE Pixel Dream theme.
# Gruvbox-inspired pixel aesthetic with warm earthy tones,
# golds, and muted greens.

$color0  = rgba(1d2021ff)   # background (gruvbox dark)
$color1  = rgba(d79921ff)   # active border 1 (gold)
$color2  = rgba(98971aff)   # active border 2 (green)
$color3  = rgba(665c54cc)   # inactive border 1
$color4  = rgba(3c3836cc)   # inactive border 2
$color5  = rgba(ea6962ff)   # red
$color6  = rgba(a9b665ff)   # green
$color7  = rgba(d8a657ff)   # yellow
$color8  = rgba(7daea3ff)   # blue
$color9  = rgba(d3869bff)   # magenta
$color10 = rgba(89b482ff)   # cyan
$color11 = rgba(d4be98ff)   # foreground (light gruvbox text)
$color12 = rgba(a89984ff)   # cursor / alt text

$font      = "Monocraft Nerd Font", "JetBrains Mono Nerd Font"
$rounding  = 0
$shadow_color = rgba(d7992144)
$wallpaper = ~/.config/hypr/themes/Pixel-Dream/wallpapers/main.png
