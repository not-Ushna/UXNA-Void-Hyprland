# ============================================================
# Jade Theme — Color Palette (Osaka-Jade inspired)
# ============================================================
# Deep jade greens, dark teal, gold/pink accents.
# Derived from Omarchy's osaka-jade colors.toml

$color0  = rgba(111C18ff)   # background — very dark green-black
$color1  = rgba(509475ff)   # accent — jade green (active borders)
$color2  = rgba(549E6Aff)   # bright green
$color3  = rgba(459451ff)   # medium green
$color4  = rgba(D7C995ff)   # gold / cursor
$color5  = rgba(0B8D59ff)   # pink / magenta accent
$color6  = rgba(54C088ff)   # cyan / teal
$color7  = rgba(DBE8C3ff)   # white
$color8  = rgba(021D22ff)   # dark surface
$color9  = rgba(044F38ff)   # red
$color10 = rgba(63B07Aff)   # bright green alt
$color11 = rgba(D7C995ff)   # yellow / gold
$color12 = rgba(54C088ff)   # light teal
$color13 = rgba(0B8D59ff)   # muted teal
$color14 = rgba(DBE8C3ff)   # light cyan
$color15 = rgba(7EEBAAff)   # Minty terminal text
$active_border = rgba(4CBF99ff)
$inactive_border = rgba(183D31ff)

$font      = JetBrains Mono Nerd Font
$rounding  = 0
$shadow_color = rgba(0B8D5944)
$wallpaper = ~/.config/hypr/themes/current/wallpapers/main.jpg
