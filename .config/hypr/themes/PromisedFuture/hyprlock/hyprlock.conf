# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Promised Future Theme — Hyprlock Config                             ║
# ║  Aurora Aero lock screen — deep blurred glass, teal-green glow.     ║
# ╚══════════════════════════════════════════════════════════════════════╝

general {
    no_fade_in = false
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/themes/current/wallpapers/main.png
    blur_passes = 4
    blur_size = 8
    contrast = 0.85
    brightness = 0.45
    vibrancy = 0.30
    vibrancy_darkness = 0.25
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.20
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgba(32, 200, 160, 0.60)
    inner_color = rgba(5, 35, 35, 0.85)
    font_color = rgb(EAFFF5)
    fade_on_empty = false
    placeholder_text = <span foreground="##20C8A0">Enter Password...</span>
    hide_input = false
    check_color = rgb(32CD32)
    fail_color = rgb(FF6B6B)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(F0D850)
    position = 0, -80
    halign = center
    valign = center
    rounding = 10
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.50)
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = JetBrains Mono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.60)
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(180, 230, 210, 0.80)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 155
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.50)
}
