# ============================================================
# PixelCraft Theme — Color Palette (Pixel Village)
# ============================================================
# Warm amber golds, deep woody browns, forest greens, and
# stone grays. Inspired by cozy pixel-art RPG villages.

$color0  = rgba(1a1410ff)   # background — deep wood
$color1  = rgba(d4a020ff)   # active border 1 — rich amber gold
$color2  = rgba(6b8c42ff)   # active border 2 — forest leaf green
$color3  = rgba(3d2b1acc)   # inactive border 1 — dark wood
$color4  = rgba(2a1f14cc)   # inactive border 2 — deep bark
$color5  = rgba(d4782fff)   # warm orange (lanterns)
$color6  = rgba(7a9a4eff)   # soft sage green (foliage)
$color7  = rgba(c9952aff)   # muted gold (awnings)
$color8  = rgba(c48db0ff)   # mauve pink (banners)
$color9  = rgba(d4782fff)   # burnt orange
$color10 = rgba(8aad5eff)   # sky blue-green
$color11 = rgba(e8d5b0ff)   # foreground — warm parchment
$color12 = rgba(b8a080ff)   # cursor — aged parchment

$font      = "Monocraft Nerd Font", "Miracode", "JetBrains Mono Nerd Font"
$rounding  = 0
$shadow_color = rgba(d4a02044)
$wallpaper = ~/.config/hypr/themes/PixelCraft/wallpapers/main.png
