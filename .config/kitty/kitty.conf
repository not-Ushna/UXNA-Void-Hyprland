# ╔══════════════════════════════════════════════════════╗
# ║  Kitty Terminal  ·  uxna's config                  ║
# ║  Colors sourced from the active Hyprland theme      ║
# ╚══════════════════════════════════════════════════════╝

# --- Font ------------------------------------------------------
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Window ----------------------------------------------------
window_padding_width    8
background_opacity      0.85
confirm_os_window_close 0

# --- Audio -----------------------------------------------------
enable_audio_bell no

# --- Cursor ----------------------------------------------------
cursor_shape          beam
cursor_blink_interval 0.5

# --- Scrollback ------------------------------------------------
scrollback_lines 10000

# --- URLs ------------------------------------------------------
detect_urls yes
url_style   curly

# --- Tab Bar ---------------------------------------------------
tab_bar_style    powerline
tab_bar_min_tabs 2

# --- Theme -----------------------------------------------------
# Dynamically sourced from the active Hyprland theme.
# Change themes via: ~/.config/hypr/scripts/switch-theme.sh
include ~/.config/hypr/themes/current/kitty/theme.conf
