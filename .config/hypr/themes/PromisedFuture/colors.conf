# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Promised Future Theme — Color Palette                               ║
# ║  True Frutiger Aero: Teal Aurora, Vibrant Green, Golden Warmth.     ║
# ╚══════════════════════════════════════════════════════════════════════╝

$color0  = rgba(002E3Dff)   # Deep teal-navy (base surface)
$color1  = rgba(ffffffee) rgba(20C8A0cc) rgba(50E8C0ee) 45deg   # Teal-green aurora border gradient
$color2  = rgba(32CD32ff)   # Vibrant grass green (iconic FA accent)
$color3  = rgba(00FF7Fff)   # Spring green
$color4  = rgba(00B4A0ff)   # Deep teal
$color5  = rgba(48D1CCff)   # Medium turquoise
$color6  = rgba(B0E6D6ff)   # Mint foam
$color7  = rgba(FFFFFFff)   # Glossy white highlight
$color8  = rgba(20C8A0aa)   # Inactive border — translucent teal
$color9  = rgba(FF6B6Bff)   # Coral red
$color10 = rgba(72EFDDff)   # Vivid aqua-mint
$color11 = rgba(F0D850ff)   # Aurora gold
$color12 = rgba(48CAE4ff)   # Sky blue
$color13 = rgba(00B4A0ff)   # Teal variant
$color14 = rgba(ADE8D4ff)   # Soft mint
$color15 = rgba(EAFFF5ff)   # Frosty white-green text
$active_border = rgba(ffffffee) rgba(20C8A0cc) rgba(50E8C0ee) 45deg
$inactive_border = rgba(20C8A0aa)

$font      = JetBrains Mono Nerd Font
$rounding  = 8
$shadow_color = rgba(20C8A044)
$wallpaper = ~/.config/hypr/themes/PromisedFuture/wallpapers/main.png

# Theme-specific decoration overrides
decoration {
    rounding = 8

    shadow {
        enabled      = true
        range        = 25
        render_power = 3
        color        = $shadow_color
        offset       = 0, 5
    }

    blur {
        enabled           = true
        size              = 8
        passes            = 4
        vibrancy          = 0.30
        vibrancy_darkness = 0.15
        noise             = 0.006
        contrast          = 0.92
        brightness        = 0.88
    }
}
