# ============================================================
# PixelCraft Theme — Hyprlock Config
# Warm pixel RPG village lock screen.
# ============================================================

general {
    no_fade_in = false
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/themes/current/wallpapers/main.png
    blur_passes = 3
    blur_size = 6
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgb(d4a020)
    inner_color = rgb(1a1410)
    font_color = rgb(e8d5b0)
    fade_on_empty = false
    placeholder_text = <span foreground="##7a7062">Enter Password...</span>
    hide_input = false
    check_color = rgb(6b8c42)
    fail_color = rgb(d4782f)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(c9952a)
    position = 0, -80
    halign = center
    valign = center
    rounding = 0
    shadow_passes = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(d4a020)
    font_size = 72
    font_family = Monocraft Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(1a1410)
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgb(e8d5b0)
    font_size = 18
    font_family = Monocraft Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 1
}
