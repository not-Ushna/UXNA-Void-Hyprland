# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Promised Future Theme — Animations                                  ║
# ║  Smooth, weighted, glassy. Inspired by Windows Vista/7 DWM.         ║
# ╚══════════════════════════════════════════════════════════════════════╝

animations {
    enabled = yes

    # Smooth curves — weighted and fluid, no overshoot
    bezier = aeroSmooth,   0.25, 1,    0.5,   1
    bezier = aeroDecel,    0.05, 0.7,  0.1,   1
    bezier = aeroSnap,     0.4,  0,    0.2,   1
    bezier = aeroFade,     0.2,  0,    0,     1
    bezier = linear,       0,    0,    1,     1

    # Border gradient rotation — visible but not distracting
    animation = border,        1, 6,   aeroSmooth
    animation = borderangle,   1, 80,  linear,      loop

    # Windows zoom in gently from ~85%, fade out quickly
    animation = windows,       1, 4,   aeroSmooth
    animation = windowsIn,     1, 4,   aeroDecel,   popin 85%
    animation = windowsOut,    1, 3,   aeroFade,    popin 90%

    # Fades
    animation = fadeIn,        1, 3,   aeroDecel
    animation = fadeOut,       1, 2.5, aeroFade

    # Layers (menus, popups)
    animation = layers,        1, 3,   aeroSmooth
    animation = layersIn,      1, 3,   aeroDecel,   fade
    animation = layersOut,     1, 2,   aeroFade,    fade
    animation = fadeLayersIn,  1, 2.5, aeroDecel
    animation = fadeLayersOut, 1, 2,   aeroFade

    # Workspace switches — horizontal slide like Win7 Flip
    animation = workspaces,    1, 4,   aeroSnap,    slide
    animation = workspacesIn,  1, 4,   aeroDecel,   slidefade 30%
    animation = workspacesOut, 1, 4,   aeroFade,    slidefade 30%
}
