# ============================================================
# common.conf — Default/canonical package names
# ============================================================
# These are the "logical" package names used throughout the
# installer. If a distro uses the same name, no override is
# needed. If a distro uses a different name, override it in
# the distro-specific .conf file.
#
# Format: canonical_name=actual_package_name
# (In common.conf, both sides are identical.)
#
# A package with an empty value (e.g. swww=) means:
#   "not available in this distro's repos — trigger fallback"

# ── Core ────────────────────────────────────────────────────
waybar=waybar
rofi-wayland=rofi-wayland
dunst=dunst
kitty=kitty
thunar=thunar
wlogout=wlogout
swayidle=swayidle
swww=swww

# ── Utilities ───────────────────────────────────────────────
